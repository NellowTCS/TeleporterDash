<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Store - Teleporter Dash</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/levelstore.css" />
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="./src/gameState.js"></script>
  </head>
  </head>
  <body>
    <button class="back-button" onclick="window.location.href='./index.html'">
      Back to Menu
    </button>

    <div class="store-container">
      <div class="header">
        <h1>Level Store</h1>
      </div>

      <div class="search-bar">
        <input
          type="text"
          placeholder="Search levels..."
          onkeyup="searchLevels(this.value)"
        />
      </div>

      <div class="filters">
        <button onclick="filterLevels('newest')">Newest</button>
        <button onclick="filterLevels('popular')">Most Popular</button>
        <button onclick="filterLevels('difficulty')">By Difficulty</button>
      </div>

      <div class="level-grid" id="levelGrid">
        <!-- Level cards will be dynamically inserted here -->
      </div>
    </div>

    <script src="./src/levelstore.js"></script>
  </body>
</html>
