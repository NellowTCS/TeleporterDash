<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <title>Teleporter Dash</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/TDMenu.css" />
  </head>

  <body>
    <audio id="menu-music" loop preload="auto">
      <source src="Sound/Basic Soundeffects/menutd.ogg" type="audio/ogg" />
    </audio>

    <div class="menu">
      <h1>Teleporter Dash</h1>
      <button onclick="handleMenuTransition('menu', 'built-in-levels')">
        Levels
      </button>
      <button onclick="handleMenuTransition('menu', 'online-levels')">
        Online Levels
      </button>
      <button onclick="window.location.href='TDStoreml'">
        Level Store
      </button>
      <button onclick="window.location.href='TDEditor.html'">
        Level Creator
      </button>
      <button onclick="handleMenuTransition('menu', 'options-menu')">
        Settings
      </button>
      <button onclick="showCredits();">Credits</button>
    </div>

    <div class="built-in-levels" style="display: none">
      <div class="level-selector">
        <!-- Will be populated by loadBuiltInLevelRegistry() -->
      </div>
    </div>

    <div class="online-levels" style="display: none">
      <div class="level-selector">
        <!-- Will be populated by loadOnlineLevelRegistry() -->
      </div>
    </div>

    <!-- Level selector templates -->
    <template id="built-in-level-template">
      <h1>Select Level</h1>
      <div class="level-display">
        <div class="level-preview"></div>
        <div class="level-info"></div>
        <div class="level-navigation">
          <button class="nav-button prev" onclick="handleLevelNavigation(-1)">Previous</button>
          <button onclick="startGame()">Play Level</button>
          <button class="nav-button next" onclick="handleLevelNavigation(1)">Next</button>
        </div>
      </div>
      <button class="back-button" onclick="handleMenuTransition('built-in-levels', 'menu')">Back to Menu</button>
    </template>

    <template id="online-level-template">
      <h1>Downloaded Levels</h1>
      <div class="level-display">
        <div class="level-preview"></div>
        <div class="level-info"></div>
        <div class="level-navigation">
          <button class="nav-button prev" onclick="handleLevelNavigation(-1)">Previous</button>
          <button onclick="startGame()">Play Level</button>
          <button class="nav-button next" onclick="handleLevelNavigation(1)">Next</button>
        </div>
      </div>
      <button class="back-button" onclick="handleMenuTransition('online-levels', 'menu')">Back to Menu</button>
    </template>

    <template id="level-display-template">
      <h1>Level Title</h1>
      <div class="level-display">
        <div class="level-preview"></div>
        <div class="level-info"></div>
        <div class="level-navigation">
          <button class="nav-button prev" onclick="handleLevelNavigation(-1)">Previous</button>
          <button onclick="startGame()">Play Level</button>
          <button class="nav-button next" onclick="handleLevelNavigation(1)">Next</button>
        </div>
      </div>
      <button class="back-button" onclick="handleMenuTransition('level-type', 'menu')">Back to Menu</button>
    </template>

    <div class="options-menu" style="display: none">
      <h1>Settings</h1>
      <div
        style="border-top: 1px solid #ccc; width: 100%; margin: 0 auto"
      ></div>
      <h3>Volume Control</h3>
      <input
        type="range"
        id="volume-slider"
        min="0"
        max="100"
        value="50"
        oninput="updateVolumeLabel()"
      />
      <p>Volume: <span id="volume-label">50</span>%</p>
      <div style="border-top: 1px solid #ccc; width: 70%; margin: 0 auto"></div>
      <h3>Clear Data</h3>
      <button onclick="clearData();">Clear All Data</button>
      <div style="border-top: 1px solid #ccc; width: 70%; margin: 0 auto"></div>
      <button onclick="handleMenuTransition('options-menu', 'menu')">
        Back
      </button>
    </div>

  <script type="module" src="./src/TDMenu.js"></script>
  </body>
</html>
